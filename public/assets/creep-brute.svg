<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BJÄSSE — tung pansarkoloss sedd rakt uppifrån, går nedåt.
       Ljus uppifrån vänster. Ingen markskugga: spelet lägger på sin egen. -->
  <defs>
    <linearGradient id="plate" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e0a6f5"/>
      <stop offset="0.45" stop-color="#c05be0"/>
      <stop offset="1" stop-color="#5d2478"/>
    </linearGradient>
    <linearGradient id="shoulder" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f0c8ff"/>
      <stop offset="0.5" stop-color="#a94ecb"/>
      <stop offset="1" stop-color="#4a1a62"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#8a2c10"/>
    </radialGradient>
    <linearGradient id="helm" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#d9d2ea"/>
      <stop offset="1" stop-color="#4b4260"/>
    </linearGradient>
  </defs>

  <g stroke="#1b0f26" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <!-- bakre benpar -->
    <path d="M140 330 L104 400 L150 414 L176 352 Z" fill="#5d2478"/>
    <path d="M372 330 L408 400 L362 414 L336 352 Z" fill="#5d2478"/>

    <!-- axelplattor -->
    <path d="M118 176 Q80 236 108 300 Q158 314 186 268 Q170 208 176 168 Z" fill="url(#shoulder)"/>
    <path d="M394 176 Q432 236 404 300 Q354 314 326 268 Q342 208 336 168 Z" fill="url(#shoulder)"/>

    <!-- huvudkropp -->
    <path d="M256 120
             Q346 132 356 216
             Q366 306 320 366
             Q256 396 192 366
             Q146 306 156 216
             Q166 132 256 120 Z" fill="url(#plate)"/>

    <!-- pansarfogar -->
    <path d="M186 214 Q256 234 326 214" fill="none" stroke="#3a1450" stroke-width="9"/>
    <path d="M192 274 Q256 296 320 274" fill="none" stroke="#3a1450" stroke-width="9"/>

    <!-- glödande kärna i bröstet -->
    <ellipse cx="256" cy="192" rx="42" ry="34" fill="url(#core)"/>

    <!-- hjälm, riktad nedåt i färdriktningen -->
    <path d="M212 340 Q256 322 300 340 Q306 386 256 402 Q206 386 212 340 Z" fill="url(#helm)"/>
    <path d="M232 356 L244 380 M280 356 L268 380" fill="none" stroke="#ff8a3d" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- högdagrar, utan kontur -->
  <g fill="#ffffff" opacity="0.32">
    <ellipse cx="206" cy="170" rx="34" ry="18" transform="rotate(-24 206 170)"/>
    <ellipse cx="142" cy="214" rx="20" ry="11" transform="rotate(-40 142 214)"/>
    <ellipse cx="240" cy="344" rx="22" ry="9" transform="rotate(-8 240 344)"/>
  </g>
</svg>
